<body data-page="tiktok" class="bg-[#F4F6F9] text-lect-navy dark:bg-lect-bgDark dark:text-slate-100 font-sans antialiased selection:bg-lect-teal selection:text-white">

    <div id="lx-topbar"></div>
    <header id="lx-header"></header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-12">
        <span class="term-label text-lect-teal font-bold">TIKTOK</span>
        <h1 class="font-display text-3xl font-bold mt-2">Conectar o TikTok da Lectnex</h1>
        <div id="tk-box" class="term-panel p-5 mt-6 space-y-4"></div>
        <p class="text-xs text-slate-500 mt-6">Página técnica: recebe a autorização do TikTok para o aplicativo da Lectnex publicar os vídeos da própria Lectnex. Não coleta dados de visitantes.</p>
    </main>
    <script>
    (function () {
        const q = new URLSearchParams(location.search), box = document.getElementById('tk-box');
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        if (q.get('error')) { box.innerHTML = '<p class="text-rose-600 font-bold">O TikTok recusou a autorização.</p><p class="text-sm">' + esc(q.get('error_description') || q.get('error')) + '</p>'; return; }
        const code = q.get('code');
        if (!code) { box.innerHTML = '<p class="text-sm">Nenhum código recebido. Abra o link de autorização enviado no Telegram.</p>'; return; }
        box.innerHTML = '<p class="font-bold text-emerald-600">Autorizado! Falta um passo.</p>' +
            '<p class="text-sm">1. Copie o código abaixo (vale poucos minutos):</p>' +
            '<textarea id="tk-code" readonly class="lx-input font-mono text-xs w-full h-24">' + esc(code) + '</textarea>' +
            '<button id="tk-copy" class="min-h-[44px] px-4 bg-lect-teal text-white font-mono text-xs font-bold">COPIAR CÓDIGO</button>' +
            '<p class="text-sm">2. No GitHub, abra <a class="text-lect-teal underline" href="https://github.com/Antenornonato7/lectnex/actions/workflows/tiktok.yml" target="_blank" rel="noopener">Actions → TikTok</a>, clique em <strong>Run workflow</strong>, escolha <strong>conectar</strong>, cole o código e rode.</p>';
        document.getElementById('tk-copy').onclick = async () => { try { await navigator.clipboard.writeText(code); } catch (e) { document.getElementById('tk-code').select(); document.execCommand('copy'); } document.getElementById('tk-copy').textContent = 'COPIADO ✓'; };
    })();
    </script>
    </main>

    <div id="lx-footer"></div>

    <script src="assets/lectnex-core.js?v=20261120a"></script><span id="lx-pronto" hidden></span>
</body>
