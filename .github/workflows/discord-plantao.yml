# Plantão do Discord: responde dúvidas novas do #duvidas e posta um resumo no canal privado #log-moderacao.
name: Discord · plantão

on:
  schedule:
    # 9h, 13h, 17h e 21h de Brasília (UTC-3), todos os dias
    - cron: '7 12,16,20,0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: discord-plantao
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Plantão
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANTAO_HORAS: '4'
          SO_SE_HOUVER: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python3 scripts/discord_plantao.py
