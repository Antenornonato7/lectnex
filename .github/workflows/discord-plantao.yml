# Plantão do Discord: responde dúvidas novas do #duvidas e posta um resumo no canal privado #log-moderacao.
name: Discord · plantão

on:
  # Disparado pelo Relógio (coletor/relogio.py) às 9h07, 13h07, 17h07 e 21h07 de Brasília.
  # O agendamento do próprio GitHub atrasava horas ou pulava (em 16/11 pulou 3 dos 4 horários).
  workflow_dispatch:
    inputs:
      automatico:
        description: 'Execução automática (só posta o resumo se houver algo novo)'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: discord-plantao
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Plantão
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANTAO_HORAS: '4'
          SO_SE_HOUVER: ${{ inputs.automatico == 'true' && '1' || '' }}
        run: python3 scripts/discord_plantao.py
      - name: Eventos ao vivo (Copom, payroll, IPCA…)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          pip install -q pillow==12.0.0 || pip install -q pillow
          python3 scripts/discord_eventos.py
