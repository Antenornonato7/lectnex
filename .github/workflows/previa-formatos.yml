# Prévia única dos formatos novos (19/11/2026) no Telegram privado do dono. Roda só neste branch; sai antes de juntar na main.
name: Prévia dos formatos novos
on:
  push:
    branches: [melhoria/formatos-redes]
  workflow_dispatch:
jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gerar e enviar
        env:
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.LECTNEX_ALERTAS_BOT || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN || secrets.ADMIN_CHAT_ID || secrets.MEU_CHAT_ID }}
        run: |
          set -e
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy
          O="$RUNNER_TEMP/p"; mkdir -p "$O"
          DIA=$(python3 -c "import json;print(json.load(open('data/dias/indice.json'))['dias'][-1])")
          python3 scripts/grafico_dia.py "data/dias/$DIA.json" "$O/grafico.png" || python3 -c "import sys,json;sys.path.insert(0,'scripts');import grafico_dia as g;g.gerar(json.load(open('data/dias/$DIA.json')),'$O/grafico.png')"
          python3 scripts/reel_historia.py "data/dias/$DIA.json" "$O/reel.mp4" --capa "$O/capa.png" --story "$O/story.png" --legenda "$O/reel-leg.txt" --x "$O/reel-x.txt"
          python3 scripts/carrossel_semana.py ranking "$O/rk" "$DIA"
          python3 scripts/carrossel_semana.py agenda "$O/ag" "$DIA"
          API="https://api.telegram.org/bot$TOK"
          msg() { curl -s -o /dev/null "$API/sendMessage" --form-string "chat_id=$CHAT" --form-string "text=$1"; }
          foto() { curl -s -o /dev/null "$API/sendPhoto" --form-string "chat_id=$CHAT" -F "photo=@$1" --form-string "caption=$2"; }
          msg "🆕 PRÉVIA DOS FORMATOS NOVOS (a partir de agora). Nada foi publicado: é só para você ver. Abaixo, na ordem: post do gráfico do dia, story do fechamento, Reels diário (lofi), carrossel do ranking (sexta) e carrossel da agenda (segunda)."
          foto "$O/grafico.png" "1/5 · POST DIÁRIO: gráfico do dia com título-conclusão (vai para a sua aprovação todo dia no fechamento)"
          foto "$O/story.png" "2/5 · STORY DO FECHAMENTO: mesmo gráfico na vertical. Ponha a figurinha de enquete na caixa de baixo."
          curl -s -o /dev/null "$API/sendVideo" --form-string "chat_id=$CHAT" -F "video=@$O/reel.mp4" -F "thumbnail=@$O/capa.png" --form-string "supports_streaming=true" --form-string "caption=3/5 · REELS DIÁRIO (12 s, áudio lofi): substitui o Reels antigo no Kit do dia"
          msg "Legenda do Reels:

          $(cat "$O/reel-leg.txt")"
          curl -s -o /dev/null "$API/sendMediaGroup" --form-string "chat_id=$CHAT" \
            -F "a=@$O/rk/B1-ranking-capa.jpg" -F "b=@$O/rk/B2-ranking-lista.jpg" -F "c=@$O/rk/B3-ranking-chamada.jpg" \
            --form-string 'media=[{"type":"photo","media":"attach://a","caption":"4/5 · CARROSSEL DE SEXTA (à noite): ranking das 5 notícias da semana"},{"type":"photo","media":"attach://b"},{"type":"photo","media":"attach://c"}]'
          foto "$O/ag/agenda-semana.jpg" "5/5 · POST DE SEGUNDA (cedo): agenda dos 5 eventos da semana para WIN e WDO"
          msg "Gostou? Responda aqui no chat do Claude e eu ligo tudo no robô (os posts continuam passando pela sua aprovação antes de publicar)."
