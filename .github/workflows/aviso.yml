# Aviso de entrega no chat PRIVADO do Telegram: resumo do que foi publicado no site.
# Disparado manualmente (ou pelo Claude) com o texto pronto; usa o mesmo envio do "Alerta de falha".
name: Aviso de entrega
run-name: "Aviso: ${{ inputs.titulo }}"

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título curto (aparece na lista do Actions)"
        required: true
      texto:
        description: "Mensagem completa"
        required: true

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coletor
      - name: Enviar no chat privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.LECTNEX_ALERTAS_BOT || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN || secrets.ADMIN_CHAT_ID || secrets.MEU_CHAT_ID }}
          TEXTO: ${{ inputs.texto }}
        run: python3 coletor/alerta.py
