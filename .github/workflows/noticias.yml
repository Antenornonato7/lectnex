# Agora no mercado: coleta manchetes a cada 2,5 min durante ~9 min por execução (o Relógio dispara a cada ~10 min, 6h–23h59).
# Publica no branch 'ao-vivo' (sem build do Pages); a cópia em data/ na main é atualizada a cada ~30 min, como reserva.
name: Notícias agora

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Duração do laço em minutos (0 = uma coleta só)'
        default: '9'

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Coletar manchetes (laço de ~9 min)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID || 'c0be7d93-6afb-4bb0-bf56-6f9171302071' }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY || secrets.LECTNEX2 || secrets.ONESIGNAL_KEY || secrets.ONESIGNAL_REST_API_KEY || secrets.ONESIGNAL || secrets.LECTNEX3 || secrets.LECTNEX || secrets.APP_API_KEY || secrets.API_KEY }}
          LOOP_MIN: ${{ inputs.minutos || '9' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.LECTNEX_ALERTAS_BOT || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN || secrets.ADMIN_CHAT_ID || secrets.MEU_CHAT_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 coletor/noticias.py
      - name: Atualizar a cópia de reserva na main (a cada ~30 min)
        run: |
          [ $(( $(date +%M | sed 's/^0//') % 30 )) -lt 10 ] || exit 0
          git config user.name "lectnex-bot"
          git config user.email "bot@lectnex.com.br"
          git add data/noticias-agora.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "noticias: $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
