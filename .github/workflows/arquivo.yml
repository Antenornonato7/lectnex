# Arquivo da Leitura do Dia: guarda cada edição e gera leitura/AAAA-MM-DD.html (indexável) + avisa os buscadores.
name: Arquivo da Leitura

on:
  push:
    branches: [main]
    paths: ['data/leitura.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sitemap   # mesmo grupo do workflow Semana: os dois mexem no sitemap
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar para a versão mais nova
        run: git pull -q --rebase origin main
      - name: Gerar páginas
        id: gerar
        run: |
          python3 scripts/arquivo.py | tee saida.txt
          echo "paginas=$(grep '^PAGINAS=' saida.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: Publicar
        id: pub
        run: |
          git config user.name "lectnex-bot"
          git config user.email "bot@lectnex.com"
          git add leitura data/leitura sitemap.xml
          git diff --cached --quiet && { echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "arquivo: leitura $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull --rebase -q origin main && git push -q origin HEAD:main
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Avisar buscadores (IndexNow)
        if: steps.pub.outputs.ok == '1' && steps.gerar.outputs.paginas != ''
        env:
          PAGINAS: ${{ steps.gerar.outputs.paginas }}
        run: sleep 60 && python3 coletor/indexnow.py
