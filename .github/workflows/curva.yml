# Curva de juros pública (Tesouro Direto + Tesouro Transparente) → data/curva.json
name: Curva de juros

on:
  # horário: definido em coletor/relogio.py (workflow "Relógio")
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: curva
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Coletar curva
        run: python3 coletor/curva.py
      - name: Publicar
        run: |
          [ -f data/curva.json ] || exit 0
          git config user.name "lectnex-bot"
          git config user.email "bot@lectnex.com.br"
          git add data/curva.json
          git diff --cached --quiet && exit 0
          git commit -m "curva: $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          ok=0; for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && { ok=1; break; }; sleep $((i*5)); done; [ "$ok" = 1 ]
