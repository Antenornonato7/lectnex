# Atualiza os dados abertos da CVM usados no site (fundos donos de cada ação e captação dos fundos de ações).
# Roda de terça a sábado às 07h17 (Brasília), logo depois da atualização diária do portal da CVM.
name: Coletor CVM

on:
  # horário: definido em coletor/relogio.py (workflow "Relógio")
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletor-cvm
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar e processar dados da CVM
        run: python coletor/coletor_cvm.py --saida data

      - name: Gerar páginas por ação (acoes/)
        id: paginas
        run: |
          python3 scripts/acoes_paginas.py | tee saida.txt
          echo "paginas=$(grep '^PAGINAS=' saida.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          rm -f saida.txt

      - name: Publicar dados atualizados
        id: pub
        run: |
          git config user.name "lectnex-bot"
          git config user.email "lectnex-bot@users.noreply.github.com"
          git add data/*.json acoes sitemap.xml
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "dados: atualização CVM $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar buscadores das páginas que mudaram (IndexNow)
        if: steps.pub.outputs.ok == '1' && steps.paginas.outputs.paginas != ''
        env:
          PAGINAS: ${{ steps.paginas.outputs.paginas }}
        run: sleep 90 && python3 coletor/indexnow.py
