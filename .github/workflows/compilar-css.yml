# Recompila assets/tailwind.css sempre que páginas ou scripts mudam,
# para o site nunca ficar com classes sem estilo.
name: Compilar CSS

on:
  push:
    branches: [main]
    paths: ['*.html', 'assets/*.js', 'assets/tailwind.src.css', 'tailwind.config.js']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compilar-css
  cancel-in-progress: true

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Tailwind CLI 3.4.16
        run: |
          curl -sSL -o tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.16/tailwindcss-linux-x64
          chmod +x tailwindcss
      - name: Compilar
        run: ./tailwindcss -c tailwind.config.js -i assets/tailwind.src.css -o assets/tailwind.css --minify
      - name: Publicar se mudou
        run: |
          git config user.name "lectnex-bot"
          git config user.email "lectnex-bot@users.noreply.github.com"
          git add assets/tailwind.css
          if git diff --cached --quiet; then echo "CSS já atualizado."; else git commit -m "css: recompilação automática" && git push; fi
