# Relatório semanal do Google Search Console no chat PRIVADO do Telegram.
# Horário: segunda-feira, definido em coletor/relogio.py (workflow "Relógio").
name: Search Console
run-name: "${{ inputs.teste && 'Teste do relatório do Google' || 'Search Console semanal' }}"

on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar agora como teste"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            coletor
            acoes
            glossario
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar biblioteca do Google
        run: pip install -q google-auth==2.38.0 requests==2.32.3
      - name: Montar e enviar
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.LECTNEX_ALERTAS_BOT || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN || secrets.ADMIN_CHAT_ID || secrets.MEU_CHAT_ID }}
          TESTE: ${{ inputs.teste && '1' || '' }}
        run: python3 coletor/search_console.py
